name: web-demo-uptime

# Every 30 minutes: is the public demo up, is AI configured, and does the page load? A failed run sends the usual
# GitHub failure e-mail. Scheduled runs happen only on the default branch.
# Setup: repository variable DEMO_URL, e.g. "https://dz-legal-assistant-ai.onrender.com".

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  check:
    if: vars.DEMO_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Health endpoint answers and AI is configured
        run: |
          body=$(curl -fsS --retry 5 --retry-delay 20 --retry-all-errors "${{ vars.DEMO_URL }}/healthz")
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          echo "$body" | grep -q '"ai":true'
      - name: The page itself loads
        run: curl -fsS --retry 3 --retry-delay 10 "${{ vars.DEMO_URL }}/" | grep -q "DZ Legal Assistant"
