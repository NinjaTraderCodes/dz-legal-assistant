<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>R3 native power features</title><style>body{margin:24px;background:#e6ebf0;color:#203447;font:16px system-ui}select,a{font:inherit;padding:8px;margin:8px 0}img{display:block;max-width:100%;height:auto;border:1px solid #6d8295}p{max-width:85ch}</style><h1>R3 native power features</h1><p>Avalonia-rendered command palettes and live detached draft. Both presentations share one case view model. Headless frames do not certify physical Windows save dialogs.</p><label>Frame <select id="files"></select></label><p><a id="original">Full-size PNG</a></p><img id="frame" alt=""><script>const names=["detached-draft-ar-light.png", "palette-ar-dark.png", "palette-ar-light.png", "palette-en-dark.png", "palette-en-light.png"];const s=document.querySelector("#files");for(const n of names)s.add(new Option(n,n));function show(){document.querySelector("#frame").src=s.value;document.querySelector("#frame").alt=s.value;document.querySelector("#original").href=s.value;}s.onchange=show;show();</script></html>
