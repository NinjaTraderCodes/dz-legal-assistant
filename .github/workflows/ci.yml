name: ci

on:
  push:
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (warnings are errors)
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build
      - name: Quality harness (Form Engine accuracy must be 100%)
        run: dotnet run -c Release --no-build --project src/DzLegal.Harness
      - name: Grounds analysis pipeline runs (template mode)
        run: dotnet run -c Release --no-build --project src/DzLegal.Harness -- grounds --models stub

  web-image:
    # The web demo's Docker image builds (what Render deploys).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the web demo image
        run: docker build -t dzlegal-web .
